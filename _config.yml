# Site
title: OpenCommons 2027
description: Two days on open technology and digital society
preposition: "at"
url: ""
baseurl: ""
timezone: Europe/Zurich
theme: jekyll-theme-conference

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

# Collections of the theme (names are fixed)
collections:
  talks:
    output: true
    permalink: /:collection/:title/
  speakers:
    output: true
    permalink: /:collection/:title/
  rooms:
    output: true
    permalink: /:collection/:title/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: speakers
    values:
      layout: speaker
  - scope:
      path: ""
      type: rooms
    values:
      layout: room

# Theme settings, see the theme's README
conference:
  lang: en
  show_errors: true  # disable in production

  meta:
    schema_org:
      organizer:
        name: OpenCommons Association
        url: https://example.org
      tickets:
        url: https://example.org/tickets
        availability: in_stock
        price: "40.00"
        priceCurrency: CHF

  info:
    bars:
      - title: Call for Participation
        color: primary
        main_only: true
        text: Submit your talk until **January 31**.

  live:
    streaming:
      enable: true

  navigation:
    links:
      - name: Program
        icon: calendar4-week
        relative_url: /program/
      - name: Talks
        icon: megaphone
        relative_url: /talks/
      - name: Speakers
        icon: people
        relative_url: /speakers/
      - name: Location
        icon: geo-alt
        relative_url: /location/
      - live: true
      - name: About
        icon: info-circle
        menu:
          - name: Code of Conduct
            relative_url: /code-of-conduct/
          - name: Contact
            absolute_url: mailto:info@example.org

    logo:
      name: OpenCommons Association
      img: logo.svg
      url: https://example.org

  talks:
    tracks:
      - name: Society
        color: info
      - name: Technology
        color: success
      - name: Workshop
        color: warning
    tags:
      - name: No Recording
        icon: camera-video-off-fill
