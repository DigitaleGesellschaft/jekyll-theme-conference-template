# Site
title: ""
description: ""
preposition: "at"
url: ""
baseurl: ""
timezone: Europe/Zurich
theme: jekyll-theme-conference

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

# Collections of the theme (names are fixed)
collections:
  talks:
    output: true
    permalink: /:collection/:title/
  speakers:
    output: true
    permalink: /:collection/:title/
  rooms:
    output: true
    permalink: /:collection/:title/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: speakers
    values:
      layout: speaker
  - scope:
      path: ""
      type: rooms
    values:
      layout: room

# Theme settings, see the theme's README
conference:
  lang: en
  show_errors: true  # disable in production

  navigation:
    links:
      - name: Program
        icon: calendar4-week
        relative_url: /program/
      - name: Talks
        icon: megaphone
        relative_url: /talks/
      - name: Speakers
        icon: people
        relative_url: /speakers/
      - name: Location
        icon: geo-alt
        relative_url: /location/

  talks:
    tracks: []
    tags: []
